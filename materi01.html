<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduversa - Materi 01</title>

    <!-- Style Sheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/materi.css" />
  </head>
  <body>
    <main class="materi-page-container">
      <header class="materi-header">
        <h1 class="materi-title">Materi 01</h1>
        <p class="materi-subtitle">
          Pelajari materi di bawah ini dengan seksama
        </p>
      </header>

      <!-- CONTENT CONTAINERS SECTION -->
      <section class="materi-content-list" aria-label="Daftar Konten Materi">
        <!-- Container 01 (Video) -->
        <article class="materi-container-card">
          <div class="materi-video-wrapper">
            <video controls preload="metadata">
              <source src="assets/videos/videos01.mp4" type="video/mp4" />
              Browser Anda tidak mendukung elemen video.
            </video>
          </div>
        </article>

        <!-- CONTENT CONTAINERS SECTION -->
      <section class="materi-content-list" aria-label="Daftar Konten Materi">
        <!-- Container 02 (Video) -->
        <article class="materi-container-card">
          <div class="materi-video-wrapper">
            <video controls preload="metadata">
              <source src="assets/videos/videos02.mp4" type="video/mp4" />
              Browser Anda tidak mendukung elemen video.
            </video>
          </div>
        </article>

        <!-- Container 03 (PDF) -->
        <article class="materi-container-card">
          <div class="materi-pdf-wrapper">
            <iframe
              src="assets/pdf/PID.pdf"
              title="Materi PID PDF"
              width="100%"
              height="600px"
              style="border: none"
            >
              Browser Anda tidak mendukung pratinjau PDF.
              <a href="assets/pdf/PID.pdf">Unduh PDF</a>
            </iframe>
          </div>
        </article>

        <!-- Container 04 -->
        <article class="materi-container-card">
          <div class="materi-image-wrapper">
            <img
              src="assets/images/materi01container03.png"
              alt="Materi 01 Bagian 3"
              loading="lazy"
            />
          </div>
        </article>

        <!-- Tempat untuk menambahkan container 04, 05, dst. di masa mendatang -->
      </section>

      <!-- FOOTER ACTION BUTTON -->
      <footer class="materi-footer">
        <a href="05edualfalah2.html" id="btn-understand" class="btn-understand">
          Sudah Mengerti
        </a>
      </footer>

      <script>
        // Event Handler saat Tombol "Sudah Mengerti" Diklik
        document
          .getElementById("btn-understand")
          .addEventListener("click", () => {
            localStorage.setItem("materi01_completed", "true");
          });
      </script>
      <!-- Panggil di halaman yang butuh proteksi back button -->
      <script src="js/prevent-back.js"></script>
    </main>
  </body>
</html>
