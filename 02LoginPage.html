<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduversa - Login</title>

    <!-- CSS Stylesheets -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth-card.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <main class="login-page-container">
      <!-- SECTION 1 -->
      <section
        id="01Section"
        class="auth-section"
        aria-label="Login Edufokus TKA"
      >
        <div id="01Section01Container" class="auth-media">
          <img
            src="assets/images/edufokustka.png"
            alt="Edufokus TKA Illustration"
            loading="lazy"
            width="400"
            height="300"
          />
        </div>
        <div id="01Section02Container" class="auth-form-container">
          <h1 class="auth-header">Login Page Fokus TKA</h1>
          <form class="auth-form" action="#" method="POST">
            <div class="form-group">
              <label for="username-01" class="form-label">Username</label>
              <input
                type="text"
                id="username-01"
                name="username"
                class="form-input"
                placeholder="Masukkan username"
                required
                autocomplete="username"
              />
            </div>
            <div class="form-group">
              <label for="password-01" class="form-label">Password</label>
              <input
                type="password"
                id="password-01"
                name="password"
                class="form-input"
                placeholder="Masukkan password"
                required
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
          </form>
        </div>
      </section>

      <!-- SECTION 2 -->
      <section id="02Section" class="auth-section" aria-label="Login Educourse">
        <div id="02Section01Container" class="auth-media">
          <img
            src="assets/images/educourse.png"
            alt="Educourse Illustration"
            loading="lazy"
            width="400"
            height="300"
          />
        </div>
        <div id="02Section02Container" class="auth-form-container">
          <h2 class="auth-header">Login Page educourse</h2>
          <form class="auth-form" action="#" method="POST">
            <div class="form-group">
              <label for="username-02" class="form-label">Username</label>
              <input
                type="text"
                id="username-02"
                name="username"
                class="form-input"
                placeholder="Masukkan username"
                required
                autocomplete="username"
              />
            </div>
            <div class="form-group">
              <label for="password-02" class="form-label">Password</label>
              <input
                type="password"
                id="password-02"
                name="password"
                class="form-input"
                placeholder="Masukkan password"
                required
                autocomplete="current-password"
              />
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
          </form>
        </div>
      </section>

      <!-- SECTION 3 -->
      <section
        id="03Section"
        class="auth-section"
        aria-label="Login Edualfalah"
      >
        <div id="03Section01Container" class="auth-media">
          <img
            src="assets/images/edualfalah2.png"
            alt="Edual falah Illustration"
            loading="lazy"
            width="400"
            height="300"
          />
        </div>

        <div id="03Section02Container" class="auth-form-container">
          <h2 class="auth-header">Login Page PJJ TIK Al Falah2</h2>

          <form id="login-form" class="auth-form">
            <div class="form-group">
              <label for="username-03" class="form-label">Username</label>
              <input
                type="text"
                id="username-03"
                name="username"
                class="form-input"
                placeholder="Masukkan username"
                required
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label for="password-03" class="form-label">Password</label>
              <div class="password-wrapper">
                <input
                  type="password"
                  id="password-03"
                  name="password"
                  class="form-input"
                  placeholder="Masukkan password"
                  required
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  id="toggle-password-03"
                  class="btn-toggle-password"
                  aria-label="Lihat Password"
                >
                  <svg
                    class="eye-icon eye-open"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg
                    class="eye-icon eye-closed hidden"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                    ></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="fullname-03" class="form-label">Nama Lengkap</label>
              <input
                type="text"
                id="fullname-03"
                name="fullname"
                class="form-input"
                placeholder="Masukkan nama lengkap"
                required
              />
            </div>

            <div class="form-group">
              <label for="class-select-03" class="form-label">Kelas</label>
              <select
                id="class-select-03"
                name="class"
                class="form-input"
                required
              >
                <option value="" disabled selected>Pilih Kelas</option>
                <option value="4A">4A</option>
                <option value="4B">4B</option>
                <option value="4C">4C</option>
                <option value="5A">5A</option>
                <option value="5B">5B</option>
                <option value="5C">5C</option>
                <option value="6A">6A</option>
                <option value="6B">6B</option>
                <option value="6C">6C</option>
              </select>
            </div>

            <button type="submit" class="btn-primary">Masuk</button>
          </form>

          <a href="LeaderboardTotal.html" class="btn-secondary-outline">
            Leaderboard Total
          </a>
        </div>
      </section>
    </main>

    <script type="module" src="js/login.js"></script>
    <script src="js/prevent-back.js"></script>
  </body>
</html>
